# Production nginx for the PDF Haven static bundle (dist/).
# Best practices baked in: immutable caching for hashed assets, no-cache for
# the app shell + SW + manifest, SPA fallback, strict security headers.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json text/plain application/xml application/rss+xml image/svg+xml;
  gzip_min_length 1024;

  # Real 404 status for unknown paths (no soft-404 SPA fallback).
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
  }

  # Uploads never hit the server (everything runs in-browser), but keep a sane cap.
  client_max_body_size 200m;

  # --- Security headers (enterprise baseline) ---
  # CSP is tight *and* compatible: pdf.js worker is same-origin, Tesseract
  # loads its engine worker from jsDelivr and language packs from tessdata,
  # previews use blob:/data: URLs, the thumbnail grid sets inline styles,
  # and the Cloudflare Web Analytics beacon is allow-listed (script + ping).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # Enable HSTS only when serving HTTPS (uncomment behind TLS):
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # --- Caching ---
  # Hashed build assets: immutable, cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location ~ ^/(manifest\.webmanifest|version\.json|index\.html)$ {
    expires off;
    add_header Cache-Control "no-cache" always;
  }
  # Crawler-facing files: short cache so updates propagate quickly.
  location ~ ^/(sitemap\.xml|robots\.txt|feed\.xml|llms\.txt)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }
  location = /og.jpg {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Every public route is prerendered to $uri/index.html. Unknown paths get a
  # real 404 via error_page above, so search engines never see a soft 404.
  location / {
    try_files $uri $uri/ =404;
  }
}
